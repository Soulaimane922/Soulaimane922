<svg viewBox="0 0 800 533" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c161d"/>
      <stop offset="100%" stop-color="#16262f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1eb0f0"/>
      <stop offset="100%" stop-color="#1387c1"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="533" fill="url(#bg)"/>
  <rect width="800" height="533" fill="url(#dots)"/>


  <!-- gear -->
  <g transform="translate(180,190)" fill="none" stroke="url(#accentGrad)" stroke-width="6">
    <circle cx="0" cy="0" r="46"/>
    <circle cx="0" cy="0" r="14" fill="#0c161d"/>
    <g stroke-width="8">
      <line x1="0" y1="-58" x2="0" y2="-70"/>
      <line x1="0" y1="58" x2="0" y2="70"/>
      <line x1="-58" y1="0" x2="-70" y2="0"/>
      <line x1="58" y1="0" x2="70" y2="0"/>
      <line x1="41" y1="-41" x2="49" y2="-49"/>
      <line x1="-41" y1="41" x2="-49" y2="49"/>
      <line x1="41" y1="41" x2="49" y2="49"/>
      <line x1="-41" y1="-41" x2="-49" y2="-49"/>
    </g>
  </g>

  <!-- arrow / progress -->
  <line x1="270" y1="190" x2="420" y2="190" stroke="#345566" stroke-width="3" stroke-dasharray="6 6"/>
  <polygon points="420,182 440,190 420,198" fill="#1eb0f0"/>

  <!-- two device screens: linux / windows generic -->
  <g transform="translate(460,120)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#1c2e38" stroke="#38c977" stroke-width="2.5"/>
    <rect x="10" y="10" width="100" height="45" rx="4" fill="#0f1c24"/>
    <rect x="15" y="18" width="60" height="6" rx="3" fill="#38c977"/>
    <rect x="15" y="30" width="80" height="6" rx="3" fill="#245c47"/>
    <rect x="45" y="80" width="30" height="10" fill="#1c2e38"/>
    <text x="60" y="105" text-anchor="middle" fill="#8fb6c9" font-family="Arial" font-size="12">Linux</text>
  </g>

  <g transform="translate(460,230)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#1c2e38" stroke="#1eb0f0" stroke-width="2.5"/>
    <rect x="10" y="10" width="45" height="27" fill="#1eb0f0" opacity="0.7"/>
    <rect x="65" y="10" width="45" height="27" fill="#1eb0f0" opacity="0.5"/>
    <rect x="10" y="43" width="45" height="27" fill="#1eb0f0" opacity="0.5"/>
    <rect x="65" y="43" width="45" height="27" fill="#1eb0f0" opacity="0.7"/>
    <rect x="45" y="80" width="30" height="10" fill="#1c2e38"/>
    <text x="60" y="105" text-anchor="middle" fill="#8fb6c9" font-family="Arial" font-size="12">Windows</text>
  </g>

  <!-- progress bar -->
  <rect x="140" y="370" width="520" height="16" rx="8" fill="#16262f"/>
  <rect x="140" y="370" width="360" height="16" rx="8" fill="url(#accentGrad)"/>
  <text x="400" y="430" text-anchor="middle" fill="#5c7c8c" font-family="Arial" font-size="13" letter-spacing="1">INSTALLATION AUTOMATISEE EN ARRIERE-PLAN</text>

</svg>