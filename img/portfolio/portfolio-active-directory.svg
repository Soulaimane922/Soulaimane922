<svg viewBox="0 0 800 533" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c161d"/>
      <stop offset="100%" stop-color="#16262f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1eb0f0"/>
      <stop offset="100%" stop-color="#1387c1"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="533" fill="url(#bg)"/>
  <rect width="800" height="533" fill="url(#dots)"/>


  <!-- domain root -->
  <g transform="translate(365,70)">
    <rect x="0" y="0" width="70" height="55" rx="8" fill="#1c2e38" stroke="url(#accentGrad)" stroke-width="2.5"/>
    <circle cx="35" cy="20" r="8" fill="#1eb0f0"/>
    <rect x="17" y="32" width="36" height="8" rx="4" fill="#1eb0f0" opacity="0.6"/>
    <text x="35" y="80" text-anchor="middle" fill="#8fb6c9" font-family="Arial" font-size="12">Domaine AD</text>
  </g>

  <!-- branches -->
  <line x1="400" y1="150" x2="230" y2="220" stroke="#345566" stroke-width="2.5"/>
  <line x1="400" y1="150" x2="400" y2="220" stroke="#345566" stroke-width="2.5"/>
  <line x1="400" y1="150" x2="570" y2="220" stroke="#345566" stroke-width="2.5"/>

  <!-- OU boxes -->
  <g font-family="Arial" font-size="12" fill="#c9e3ef">
    <g transform="translate(180,220)">
      <rect width="100" height="46" rx="8" fill="#12222b" stroke="#38c977" stroke-width="2"/>
      <text x="50" y="28" text-anchor="middle">OU Ventes</text>
    </g>
    <g transform="translate(350,220)">
      <rect width="100" height="46" rx="8" fill="#12222b" stroke="#1eb0f0" stroke-width="2"/>
      <text x="50" y="28" text-anchor="middle">OU IT</text>
    </g>
    <g transform="translate(520,220)">
      <rect width="100" height="46" rx="8" fill="#12222b" stroke="#f0a63a" stroke-width="2"/>
      <text x="50" y="28" text-anchor="middle">OU RH</text>
    </g>
  </g>

  <!-- users under OU IT -->
  <g stroke="#345566" stroke-width="2">
    <line x1="400" y1="266" x2="370" y2="320"/>
    <line x1="400" y1="266" x2="400" y2="320"/>
    <line x1="400" y1="266" x2="430" y2="320"/>
  </g>
  <g fill="#1c2e38" stroke="#1eb0f0" stroke-width="1.5">
    <circle cx="370" cy="335" r="15"/>
    <circle cx="400" cy="335" r="15"/>
    <circle cx="430" cy="335" r="15"/>
  </g>

  <!-- lock badge for NTFS -->
  <g transform="translate(600,320)">
    <rect x="0" y="14" width="40" height="30" rx="6" fill="#12222b" stroke="#f0c23a" stroke-width="2.5"/>
    <path d="M6 14 V4 a14 14 0 0 1 28 0 V14" fill="none" stroke="#f0c23a" stroke-width="2.5"/>
  </g>

  <text x="400" y="440" text-anchor="middle" fill="#5c7c8c" font-family="Arial" font-size="13" letter-spacing="1">ACTIVE DIRECTORY &#8226; DROITS NTFS</text>

</svg>