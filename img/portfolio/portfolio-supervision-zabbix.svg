<svg viewBox="0 0 800 533" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c161d"/>
      <stop offset="100%" stop-color="#16262f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1eb0f0"/>
      <stop offset="100%" stop-color="#1387c1"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="533" fill="url(#bg)"/>
  <rect width="800" height="533" fill="url(#dots)"/>


  <!-- dashboard panel -->
  <rect x="120" y="80" width="560" height="300" rx="14" fill="#0f1c24" stroke="url(#accentGrad)" stroke-width="2.5"/>
  <rect x="120" y="80" width="560" height="40" rx="14" fill="#16262f"/>
  <circle cx="150" cy="100" r="6" fill="#38c977"/>
  <text x="170" y="105" fill="#8fb6c9" font-family="Arial" font-size="13">Supervision &#8226; Etat du parc</text>

  <!-- grid lines -->
  <g stroke="#22333d" stroke-width="1">
    <line x1="160" y1="330" x2="640" y2="330"/>
    <line x1="160" y1="280" x2="640" y2="280"/>
    <line x1="160" y1="230" x2="640" y2="230"/>
    <line x1="160" y1="180" x2="640" y2="180"/>
  </g>

  <!-- line chart -->
  <polyline points="170,300 230,260 290,290 350,200 410,240 470,170 530,210 590,150 630,190"
    fill="none" stroke="#1eb0f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#1eb0f0">
    <circle cx="350" cy="200" r="5"/>
    <circle cx="470" cy="170" r="5"/>
    <circle cx="590" cy="150" r="5"/>
  </g>

  <!-- bars -->
  <g fill="#38c977" opacity="0.85">
    <rect x="180" y="345" width="18" height="18"/>
    <rect x="220" y="335" width="18" height="28"/>
    <rect x="260" y="325" width="18" height="38"/>
  </g>

  <!-- alert badge -->
  <g transform="translate(560,90)">
    <circle cx="12" cy="12" r="13" fill="#12222b" stroke="#f0605a" stroke-width="2.5"/>
    <text x="12" y="17" text-anchor="middle" fill="#f0605a" font-family="Arial" font-size="14" font-weight="700">!</text>
  </g>

  <text x="400" y="430" text-anchor="middle" fill="#5c7c8c" font-family="Arial" font-size="13" letter-spacing="1">ZABBIX &#8226; GESTION DE PARC GLPI</text>

</svg>