<svg viewBox="0 0 800 533" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c161d"/>
      <stop offset="100%" stop-color="#16262f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1eb0f0"/>
      <stop offset="100%" stop-color="#1387c1"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="533" fill="url(#bg)"/>
  <rect width="800" height="533" fill="url(#dots)"/>


  <!-- central switch -->
  <rect x="350" y="230" width="100" height="70" rx="10" fill="#1c2e38" stroke="url(#accentGrad)" stroke-width="2.5"/>
  <g fill="#1eb0f0">
    <circle cx="370" cy="250" r="4"/><circle cx="385" cy="250" r="4"/><circle cx="400" cy="250" r="4"/><circle cx="415" cy="250" r="4"/><circle cx="430" cy="250" r="4"/>
    <circle cx="370" cy="270" r="4"/><circle cx="385" cy="270" r="4"/><circle cx="400" cy="270" r="4"/><circle cx="415" cy="270" r="4"/><circle cx="430" cy="270" r="4"/>
  </g>

  <!-- star topology to nodes -->
  <g stroke="#345566" stroke-width="2.5">
    <line x1="400" y1="230" x2="220" y2="120"/>
    <line x1="400" y1="230" x2="400" y2="100"/>
    <line x1="400" y1="230" x2="580" y2="120"/>
    <line x1="400" y1="300" x2="220" y2="410"/>
    <line x1="400" y1="300" x2="400" y2="440"/>
    <line x1="400" y1="300" x2="580" y2="410"/>
  </g>

  <g fill="#12222b" stroke="#1eb0f0" stroke-width="2">
    <rect x="190" y="85" width="60" height="40" rx="6"/>
    <rect x="370" y="65" width="60" height="40" rx="6"/>
    <rect x="550" y="85" width="60" height="40" rx="6"/>
    <rect x="190" y="410" width="60" height="40" rx="6"/>
    <rect x="370" y="440" width="60" height="40" rx="6"/>
    <rect x="550" y="410" width="60" height="40" rx="6"/>
  </g>

  <!-- RJ45 connector icon -->
  <g transform="translate(60,240)">
    <rect x="0" y="0" width="40" height="55" rx="4" fill="#12222b" stroke="#f0c23a" stroke-width="2.5"/>
    <rect x="6" y="0" width="5" height="14" fill="#f0c23a"/>
    <rect x="16" y="0" width="5" height="14" fill="#f0c23a"/>
    <rect x="26" y="0" width="5" height="14" fill="#f0c23a"/>
  </g>

  <text x="400" y="500" text-anchor="middle" fill="#5c7c8c" font-family="Arial" font-size="13" letter-spacing="1">CABLAGE RJ45 &#8226; PLAN D'ARCHITECTURE VISIO</text>

</svg>