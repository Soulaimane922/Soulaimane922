<svg viewBox="0 0 800 533" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c161d"/>
      <stop offset="100%" stop-color="#16262f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1eb0f0"/>
      <stop offset="100%" stop-color="#1387c1"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="533" fill="url(#bg)"/>
  <rect width="800" height="533" fill="url(#dots)"/>


  <!-- Router -->
  <rect x="330" y="70" width="140" height="60" rx="10" fill="#1c2e38" stroke="url(#accentGrad)" stroke-width="2.5"/>
  <circle cx="352" cy="100" r="6" fill="#1eb0f0"/>
  <circle cx="372" cy="100" r="6" fill="#1eb0f0"/>
  <circle cx="392" cy="100" r="6" fill="#1eb0f0"/>
  <text x="400" y="150" text-anchor="middle" fill="#8fb6c9" font-family="Arial" font-size="14">Routeur inter-VLAN</text>

  <!-- trunk line -->
  <line x1="400" y1="130" x2="400" y2="210" stroke="url(#accentGrad)" stroke-width="5"/>
  <line x1="400" y1="160" x2="400" y2="180" stroke="#0c161d" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- Switch -->
  <rect x="290" y="210" width="220" height="50" rx="10" fill="#1c2e38" stroke="url(#accentGrad)" stroke-width="2.5"/>
  <text x="400" y="240" text-anchor="middle" fill="#e7f2f7" font-family="Arial" font-size="15" font-weight="600">SWITCH</text>

  <!-- ports + VLAN colored branches -->
  <g stroke-width="3">
    <line x1="330" y1="260" x2="220" y2="330" stroke="#1eb0f0"/>
    <line x1="360" y1="260" x2="240" y2="330" stroke="#1eb0f0"/>
    <line x1="400" y1="260" x2="400" y2="330" stroke="#38c977"/>
    <line x1="400" y1="260" x2="420" y2="330" stroke="#38c977"/>
    <line x1="440" y1="260" x2="560" y2="330" stroke="#f0a63a"/>
    <line x1="470" y1="260" x2="580" y2="330" stroke="#f0a63a"/>
  </g>

  <!-- End devices -->
  <g>
    <rect x="190" y="330" width="80" height="50" rx="8" fill="#12222b" stroke="#1eb0f0" stroke-width="2"/>
    <text x="230" y="360" text-anchor="middle" fill="#1eb0f0" font-family="Arial" font-size="12">VLAN 10</text>

    <rect x="360" y="330" width="80" height="50" rx="8" fill="#12222b" stroke="#38c977" stroke-width="2"/>
    <text x="400" y="360" text-anchor="middle" fill="#38c977" font-family="Arial" font-size="12">VLAN 20</text>

    <rect x="530" y="330" width="80" height="50" rx="8" fill="#12222b" stroke="#f0a63a" stroke-width="2"/>
    <text x="570" y="360" text-anchor="middle" fill="#f0a63a" font-family="Arial" font-size="12">VLAN 30</text>
  </g>

  <text x="400" y="440" text-anchor="middle" fill="#5c7c8c" font-family="Arial" font-size="13" letter-spacing="1">TRUNK 802.1Q &#8226; ROUTAGE INTER-VLAN</text>

</svg>