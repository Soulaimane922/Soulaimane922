<svg viewBox="0 0 800 533" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c161d"/>
      <stop offset="100%" stop-color="#16262f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1eb0f0"/>
      <stop offset="100%" stop-color="#1387c1"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="533" fill="url(#bg)"/>
  <rect width="800" height="533" fill="url(#dots)"/>


  <!-- terminal window -->
  <rect x="140" y="90" width="360" height="240" rx="14" fill="#0f1c24" stroke="url(#accentGrad)" stroke-width="2.5"/>
  <rect x="140" y="90" width="360" height="34" rx="14" fill="#16262f"/>
  <circle cx="164" cy="107" r="6" fill="#f0605a"/>
  <circle cx="184" cy="107" r="6" fill="#f0c23a"/>
  <circle cx="204" cy="107" r="6" fill="#38c977"/>

  <g font-family="Consolas, monospace" font-size="14" fill="#7fd0ff">
    <text x="160" y="155">$ vagrant up</text>
    <text x="160" y="180" fill="#38c977">==&gt; Bringing machine 'srv-linux' up...</text>
    <text x="160" y="205" fill="#8fb6c9">==&gt; Configuring network interfaces</text>
    <text x="160" y="230" fill="#8fb6c9">==&gt; Applying firewall rules</text>
    <text x="160" y="255" fill="#f0c23a">==&gt; Hardening SSH access</text>
    <text x="160" y="280" fill="#38c977">[OK] Environment ready &#10003;</text>
  </g>

  <!-- shield badge -->
  <g transform="translate(500,250)">
    <path d="M50 0 L95 18 V55 C95 90 72 112 50 122 C28 112 5 90 5 55 V18 Z" fill="#12222b" stroke="url(#accentGrad)" stroke-width="3"/>
    <path d="M32 62 L45 76 L70 46" fill="none" stroke="#38c977" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- VM stack -->
  <g transform="translate(560,90)">
    <rect x="0" y="0" width="70" height="18" rx="4" fill="#1c2e38" stroke="#1eb0f0" stroke-width="1.5"/>
    <rect x="10" y="-14" width="70" height="18" rx="4" fill="#1c2e38" stroke="#1eb0f0" stroke-width="1.5" opacity="0.7"/>
  </g>

  <text x="400" y="470" text-anchor="middle" fill="#5c7c8c" font-family="Arial" font-size="13" letter-spacing="1">VM VAGRANT &#8226; DURCISSEMENT DES ACCES</text>

</svg>